version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./confusion_detector.db
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost:3000
    volumes:
      - ./data:/app/data
      - db-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
